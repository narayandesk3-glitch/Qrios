<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0C271E" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="QRIOS" />
<title>QRIOS</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');
:root{
  --emerald:#12362A; --emerald-deep:#0C271E; --emerald-soft:#1C4536;
  --brass:#C9A550; --brass-soft:#E4CE96;
  --cream:#FAF5EA; --card:#FFFDF8; --ink:#1A1F1B; --muted:#7C837C; --mutedD:#A9B4A9;
  --line:#E8E0CE; --lineD:rgba(250,245,234,.12);
  --red:#B5482F; --redS:#F6E2DC; --green:#2E7D53; --greenS:#E2F0E7;
  --amberS:#F7EDD3; --amberI:#8A6D1F;
  --fd:'Fraunces',serif; --fb:'Inter',sans-serif; --fm:'IBM Plex Mono',monospace;
  --sh:0 18px 44px rgba(12,39,30,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
button{font:inherit;cursor:pointer;border:0;background:none}
input,textarea,select{font:inherit;outline:none}
body{font-family:var(--fb);background:var(--emerald-deep);color:var(--cream);min-height:100dvh}
.sn::-webkit-scrollbar{display:none} .sn{scrollbar-width:none}

/* shell */
.wrap{max-width:520px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--cream);color:var(--ink);position:relative}
.wrap.dark{background:var(--emerald-deep);color:var(--cream)}
.hd{background:var(--emerald);color:var(--cream);padding:16px 18px;position:sticky;top:0;z-index:20}
.hd-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.hd h1{font-family:var(--fd);font-size:18px;font-weight:600}
.hd .sub{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass-soft);margin-top:3px}
.chip{background:rgba(250,245,234,.08);border:1px solid rgba(201,165,80,.4);border-radius:12px;padding:6px 11px;text-align:center}
.chip b{display:block;font-family:var(--fm);font-size:14px;color:var(--brass-soft)}
.chip span{font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--mutedD)}
.body{flex:1;min-height:0;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.tabs{display:flex;gap:2px;margin-top:14px}
.tab{flex:1;padding:9px 2px;text-align:center;font-size:11px;font-weight:600;color:var(--mutedD);border-bottom:2.5px solid transparent;position:relative}
.tab.on{color:var(--cream);border-color:var(--brass)}
.tab .b{position:absolute;top:-2px;right:12%;min-width:15px;height:15px;padding:0 4px;border-radius:8px;background:var(--brass);color:var(--emerald-deep);font-size:9px;font-weight:800;display:grid;place-items:center;font-family:var(--fm)}

/* bits */
.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:14px;margin-bottom:10px}
.cta{width:100%;padding:14px;border-radius:13px;font-size:14px;font-weight:700;background:var(--emerald);color:var(--cream);margin-top:14px}
.cta.brass{background:var(--brass);color:var(--emerald-deep)}
.cta:disabled{background:#D8D2C2;color:var(--muted)}
.inp{width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);font-size:15px;color:var(--ink)}
.inp:focus{border-color:var(--brass)}
.lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:14px 0 7px}
.grp{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--card)}
.grp span{padding:12px;background:#F1EBDD;color:var(--muted);font-family:var(--fm);font-size:13px}
.grp input{flex:1;border:0;background:transparent;padding:12px;font-size:15px;font-family:var(--fm);color:var(--ink)}
.err{display:flex;gap:8px;align-items:center;background:var(--redS);color:var(--red);border-radius:11px;padding:10px 12px;font-size:12.5px;margin-top:12px}
.ok-box{display:flex;gap:8px;align-items:center;background:var(--greenS);color:var(--green);border-radius:11px;padding:10px 12px;font-size:12.5px;margin-top:12px}
.pins{display:flex;gap:10px;justify-content:center;margin-top:16px}
.pins input{width:54px;height:62px;text-align:center;font-family:var(--fm);font-size:23px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink)}
@keyframes shk{0%,100%{transform:none}25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.shk{animation:shk .35s}
.st{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;padding:4px 9px;border-radius:7px}
.s-placed{background:var(--amberS);color:var(--amberI)} .s-accepted{background:#E4EDF6;color:#33608C}
.s-preparing{background:var(--amberS);color:var(--amberI)} .s-ready{background:var(--greenS);color:var(--green)}
.s-served{background:#EEE9DC;color:var(--muted)} .s-rejected{background:var(--redS);color:var(--red)}
.row{display:flex;align-items:center;gap:11px}
.mono{font-family:var(--fm)}
.mut{color:var(--muted);font-size:12px}
.h4{font-family:var(--fd);font-size:15px;color:var(--emerald);margin-bottom:9px}
.avs{display:flex;margin-top:12px}
.av{width:29px;height:29px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:var(--emerald-deep);border:2px solid var(--emerald);margin-right:-7px}
.add{background:var(--emerald);color:var(--cream);font-size:11.5px;font-weight:700;padding:8px 13px;border-radius:10px}
.stp{display:flex;align-items:center;gap:9px;background:var(--emerald);border-radius:10px;padding:6px 9px}
.stp button{color:var(--cream);font-size:16px;line-height:1;width:16px}
.stp span{font-family:var(--fm);font-size:13px;color:var(--brass-soft);min-width:11px;text-align:center}
.veg{width:14px;height:14px;border:1.5px solid var(--green);border-radius:3px;display:grid;place-items:center;flex-shrink:0;margin-top:3px}
.veg::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.bar{flex-shrink:0;margin:0 16px 16px;background:var(--brass);color:var(--emerald-deep);border-radius:14px;padding:13px 16px;display:flex;justify-content:space-between;font-weight:700;font-size:13.5px}
.trk{display:flex;margin-top:12px}
.tstep{flex:1;text-align:center;position:relative}
.tstep .d{width:10px;height:10px;border-radius:50%;background:var(--line);margin:0 auto 5px;position:relative;z-index:1}
.tstep.dn .d{background:var(--brass)} .tstep.now .d{background:var(--emerald);box-shadow:0 0 0 4px rgba(18,54,42,.14)}
.tstep .l{font-size:8px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tstep.dn .l,.tstep.now .l{color:var(--emerald);font-weight:700}
.tstep::before{content:"";position:absolute;top:4px;left:-50%;width:100%;height:1.5px;background:var(--line)}
.tstep:first-child::before{display:none}
.tstep.dn::before,.tstep.now::before{background:var(--brass)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.hb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:15px 8px;display:flex;flex-direction:column;align-items:center;gap:7px;font-size:11.5px;font-weight:600;color:var(--ink)}
.hb.on{border-color:var(--brass);background:var(--amberS)}
.tk{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px;margin-bottom:10px}
.tk.late{border-color:var(--red);box-shadow:0 0 0 3px rgba(181,72,47,.07)}
.tbtn{flex:1;padding:10px;border-radius:10px;font-size:11.5px;font-weight:700}
.t-ok{background:var(--emerald);color:var(--cream)} .t-no{background:var(--redS);color:var(--red)}
.t-nx{background:var(--brass);color:var(--emerald-deep)}
.empty{text-align:center;padding:34px 14px;color:var(--muted);font-size:12.5px}
.empty b{display:block;font-family:var(--fd);font-size:15px;color:var(--ink);margin-bottom:5px}
.sw{width:42px;height:24px;border-radius:99px;background:#D8D2C2;position:relative;flex-shrink:0}
.sw::after{content:"";position:absolute;width:18px;height:18px;border-radius:50%;top:3px;left:3px;background:#fff;transition:.15s}
.sw.on{background:var(--green)} .sw.on::after{left:21px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--emerald);color:var(--cream);padding:12px 20px;border-radius:13px;font-size:13px;font-weight:600;box-shadow:var(--sh);transition:.28s;z-index:200;border:1px solid rgba(201,165,80,.4);max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
.conn{position:fixed;top:8px;right:8px;z-index:210;font-size:9.5px;font-family:var(--fm);padding:4px 9px;border-radius:8px;letter-spacing:.08em}
.conn.live{background:rgba(46,125,83,.9);color:#fff}
.conn.off{background:rgba(181,72,47,.95);color:#fff}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.kpi .v{font-family:var(--fd);font-size:21px;font-weight:600;color:var(--emerald)}
.kpi .l{font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.brow{margin-bottom:9px}
.brow .t{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.btrack{height:7px;background:#EFE9DA;border-radius:99px;overflow:hidden}
.bfill{height:100%;background:linear-gradient(90deg,var(--brass),var(--brass-soft));border-radius:99px}
.bfill.g{background:linear-gradient(90deg,var(--emerald-soft),var(--green))}
.vbars{display:flex;align-items:flex-end;gap:5px;height:88px;margin-top:8px}
.vb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.vb .bar2{width:100%;background:linear-gradient(180deg,var(--brass-soft),var(--brass));border-radius:5px 5px 2px 2px;min-height:3px}
.vb .bar2.now{background:linear-gradient(180deg,#3E7A5E,var(--emerald))}
.vb .lbl{font-size:8.5px;color:var(--muted);font-family:var(--fm)}
.pill2{display:flex;justify-content:space-between;padding:9px 12px;border-radius:10px;background:#F5EFE1;margin-bottom:7px;font-size:12.5px}
.hero{padding:34px 22px;text-align:center}
.hero .mk{width:72px;height:72px;border-radius:20px;margin:0 auto 18px;background:linear-gradient(150deg,#153A2D,#0C271E);display:grid;place-items:center;box-shadow:0 10px 30px rgba(201,165,80,.24),inset 0 0 0 2px rgba(201,165,80,.5)}
.hero h1{font-family:var(--fd);font-size:34px;letter-spacing:.16em}
.hero h1 i{font-style:normal;color:var(--brass)}
.hero p{font-size:13px;color:var(--mutedD);margin-top:10px;line-height:1.6}
.ent{background:rgba(250,245,234,.05);border:1px solid var(--lineD);border-radius:16px;padding:18px;margin-top:11px;display:flex;align-items:center;gap:13px;text-align:left;width:100%;color:var(--cream)}
.ent b{font-size:14px;font-family:var(--fd);font-weight:600;display:block}
.ent span{font-size:11.5px;color:var(--mutedD);display:block;margin-top:2px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="conn" class="conn off">connecting…</div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ══════════════════════════════════════════════════════════════
   ⚠️  PASTE YOUR SUPABASE KEYS HERE  (Project Settings → API)
   The anon key is meant to be public — it's safe in client code.
   ══════════════════════════════════════════════════════════════ */
/* Baked in so guests never see a setup screen — they scan and order.
   Publishable/anon keys are designed to live in client code; RLS protects the data.
   To point at a different project, override once in the browser console:
     localStorage.setItem('qrios_url','…'); localStorage.setItem('qrios_key','…'); location.reload();
*/
const SUPABASE_URL  = localStorage.getItem('qrios_url') || "https://efyepjchaeblxryrhznr.supabase.co";
const SUPABASE_ANON = localStorage.getItem('qrios_key') || "sb_publishable_2ZJtscPWHxUkVvv1Msi5mg_5TQytTqg";

const sb = (SUPABASE_URL && SUPABASE_ANON) ? createClient(SUPABASE_URL, SUPABASE_ANON) : null;

/* ───────── helpers ───────── */
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const qs = new URLSearchParams(location.search);
let toastT;
function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('on'),2400); }
let lastSync=0, rtEvents=0;
function setConn(live){
  const c=$('conn'); if(!c) return;
  c.className='conn '+(live?'live':'off');
  const secs = lastSync? Math.round((Date.now()-lastSync)/1000) : null;
  c.textContent = (live?'● live':'○ offline') + (rtEvents?` ⚡${rtEvents}`:'') + (secs!==null?` ${secs}s`:'');
}
setInterval(()=>setConn(document.querySelector('.conn.live')!==null), 1000);
const mins = ts => Math.floor((Date.now()-new Date(ts))/60000);
const ago  = ts => { const m=mins(ts); return m<1?'just now':m+'m ago'; };
const LOGO = (s,c)=>`<svg viewBox="0 0 64 64" fill="none" style="width:${s}px;height:${s}px"><g stroke="${c}" stroke-width="${s<24?4.5:3.2}" stroke-linejoin="round" stroke-linecap="round"><path d="M10 4H21L27 10V21L21 27H10L4 21V10Z"/><path d="M37 4H48L54 10V21L48 27H37L31 21V10Z"/><path d="M10 31H21L27 37V48L21 54H10L4 48V37Z"/><path d="M37 31H48L54 37V48L61 62L44 54H37L31 48V37Z"/></g></svg>`;

const FLOW = ['placed','accepted','preparing','ready','served'];
const FLOW_L = {placed:'Placed',accepted:'Accepted',preparing:'Cooking',ready:'Ready',served:'Served',rejected:'Declined'};
const REQS = [['water','Water','🥛'],['cutlery','Cutlery','🍴'],['cleaning','Clean table','🧹'],['other','Call captain','🛎']];

/* ───────── state (mirrors the DB; refreshed by realtime) ───────── */
const S = {
  view:'boot', role:null, err:'',
  rest:null, tableLabel:'', qrToken: qs.get('t')||'',
  sessionId:localStorage.getItem('qrios_sess')||null,
  memberId:localStorage.getItem('qrios_mem')||null,
  myName:localStorage.getItem('qrios_name')||'',
  isHost:localStorage.getItem('qrios_host')==='1',
  pin:'', members:[], menu:[], orders:[], items:[], requests:[],
  cart:{}, tab:'menu',
  regName:'', regPhone:'', agree:false,
  joinName:'', pinIn:['','','',''], pinErr:false, attempts:0, showHelp:false, joinMsg:'',
  staff:null, tickets:[], allReq:[], sessions:[],
  code:'', codeErr:'',
  splitMode:'together', payMethod:null,
  busy:false,
};

/* ───────── data loading ───────── */
async function loadRestaurant(){
  const { data } = await sb.from('restaurants').select('*').limit(1).single();
  S.rest = data;
}
async function loadMenu(){
  const { data } = await sb.from('menu_items').select('*')
    .eq('restaurant_id', S.rest.id).order('sort_order');
  S.menu = data||[];
}
async function loadSession(){
  if(!S.sessionId) return;
  const { data: sess } = await sb.from('sessions').select('*, tables(label)').eq('id',S.sessionId).maybeSingle();
  if(!sess || sess.status==='closed'){
    const wasOpen = !!S.sessionId;
    clearSession();
    if(wasOpen){ S.view='closed'; }
    return;
  }
  S.pin = sess.pin; S.tableLabel = sess.tables?.label||'';
  const { data: mem } = await sb.from('session_members').select('*').eq('session_id',S.sessionId).order('joined_at');
  S.members = mem||[];
  const { data: ords } = await sb.from('orders').select('*').eq('session_id',S.sessionId).order('placed_at',{ascending:false});
  S.orders = ords||[];
  const ids = S.orders.map(o=>o.id);
  S.items = ids.length ? (await sb.from('order_items').select('*').in('order_id',ids)).data||[] : [];
  const { data: rq } = await sb.from('requests').select('*').eq('session_id',S.sessionId).order('created_at',{ascending:false});
  S.requests = rq||[];
}
let STATS=null;
async function loadStats(){
  try{ const { data } = await sb.rpc('owner_stats',{p_days:7}); STATS=data; }
  catch(e){ console.error('stats',e); }
}
async function loadStaffData(){
  const { data: ords } = await sb.from('orders').select('*, sessions(id, tables(label))')
    .eq('restaurant_id',S.rest.id).in('status',['placed','accepted','preparing','ready'])
    .order('placed_at');
  S.tickets = ords||[];
  if(S.role==='owner'||S.role==='manager') await loadStats();
  const ids = S.tickets.map(o=>o.id);
  S.items = ids.length ? (await sb.from('order_items').select('*').in('order_id',ids)).data||[] : [];
  const { data: rq } = await sb.from('requests').select('*, sessions(tables(label))')
    .eq('restaurant_id',S.rest.id).eq('status','open').order('created_at');
  S.allReq = rq||[];
  const { data: ss } = await sb.from('sessions').select('*, tables(label), session_members(name,is_host)')
    .eq('restaurant_id',S.rest.id).neq('status','closed');
  S.sessions = ss||[];
}
function clearSession(){
  ['qrios_sess','qrios_mem','qrios_name','qrios_host'].forEach(k=>localStorage.removeItem(k));
  S.sessionId=null; S.memberId=null; S.isHost=false; S.members=[]; S.orders=[]; S.items=[]; S.requests=[]; S.cart={};
}

/* ───────── realtime ───────── */
let chan;
async function subscribe(){
  if(chan) await sb.removeChannel(chan);
  chan = sb.channel('qrios-'+(S.sessionId||S.role||'x'))
    .on('postgres_changes',{event:'*',schema:'public',table:'orders'},      onChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'order_items'}, onChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'requests'},    onChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'sessions'},    onChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'session_members'},onChange)
    .on('postgres_changes',{event:'*',schema:'public',table:'menu_items'},  onChange)
    .subscribe(st=>{
      setConn(st==='SUBSCRIBED');
      if(st==='CHANNEL_ERROR' || st==='TIMED_OUT'){ setTimeout(subscribe, 3000); }
    });
}
let pending=false;
async function onChange(payload){
  rtEvents++;                       // proves realtime is actually delivering
  if(pending) return; pending=true;
  setTimeout(async ()=>{
    pending=false;
    const prev = JSON.stringify(S.orders.map(o=>[o.id,o.status]));
    if(S.role) await loadStaffData(); else await loadSession();
    await loadMenu();
    if(!S.role){
      const now = JSON.stringify(S.orders.map(o=>[o.id,o.status]));
      if(now!==prev && S.orders[0]) notifyStatus();
    }
    render();
  }, 180);
}
function notifyStatus(){
  const o=S.orders[0];
  const m={accepted:'Kitchen accepted your order',preparing:'Your food is on the stove',ready:'Ready — coming to your table',served:'Served. Enjoy! 🍽',rejected:'An item was declined — see Orders'};
  if(m[o.status]) toast(m[o.status]);
}

/* ───────── actions ───────── */
async function startOrJoin(pin){
  S.busy=true; render();
  const { data, error } = await sb.rpc('join_table',{
    p_qr_token:S.qrToken, p_name:(pin?S.joinName:S.regName).trim(),
    p_phone:S.regPhone||'', p_pin:pin||null
  });
  S.busy=false;
  const r = Array.isArray(data)?data[0]:data;
  if(error){
    console.error('join_table failed:', error);
    const msg = error.message || 'Unknown error';
    S.err = msg; S.joinMsg = msg;
    render(); return;
  }
  if(!r){ S.err='No response from the server — please try again.'; S.joinMsg=S.err; render(); return; }
  if(r.error){
    const wrongPin = /pin/i.test(r.error);
    if(pin && wrongPin){
      S.pinErr=true; S.pinIn=['','','','']; S.attempts++; if(S.attempts>=2) S.showHelp=true;
      S.joinMsg='';
    } else {
      // full table, closed session, unknown QR — say what actually happened
      S.joinMsg = r.error; S.err = r.error;
    }
    render(); return;
  }
  S.sessionId=r.session_id; S.memberId=r.member_id; S.isHost=r.is_host;
  S.myName=(pin?S.joinName:S.regName).trim(); S.pin=r.pin; S.tableLabel=r.table_label;
  localStorage.setItem('qrios_sess',S.sessionId); localStorage.setItem('qrios_mem',S.memberId);
  localStorage.setItem('qrios_name',S.myName); localStorage.setItem('qrios_host',r.is_host?'1':'0');
  S.view='guest'; S.tab='menu'; S.pinErr=false; S.attempts=0;
  await loadSession(); await subscribe(); render();
  toast(r.is_host?`Table started — PIN ${r.pin}`:'You\'re in!');
}
async function placeOrder(){
  const items = Object.entries(S.cart).map(([id,q])=>({menu_item_id:id,qty:q,added_by:S.myName}));
  if(!items.length) return;
  S.busy=true; render();
  const { error } = await sb.rpc('place_order',{p_session_id:S.sessionId,p_items:items});
  S.busy=false;
  if(error){ toast(error.message); render(); return; }
  S.cart={}; S.tab='orders';
  await loadSession(); render(); toast('Sent to the kitchen');
}
async function advance(id,to,reason){
  await sb.rpc('advance_order',{p_order_id:id,p_to:to,p_reason:reason||null});
  await loadStaffData(); render();
}
async function sendReq(type,label){
  if(S.requests.some(r=>r.type===type&&r.status==='open')){ toast('Already on the way'); return; }
  await sb.from('requests').insert({
    restaurant_id:S.rest.id, session_id:S.sessionId, table_label:S.tableLabel,
    type, label
  });
  await loadSession(); render(); toast(label+' requested');
}
async function resolveReq(id){
  await sb.from('requests').update({status:'done',resolved_at:new Date().toISOString()}).eq('id',id);
  await loadStaffData(); render(); toast('Done');
}
async function settle(method){
  S.busy=true;
  const breakdown = splitSummary();
  render();
  await sb.rpc('settle_session',{p_session_id:S.sessionId,p_method:method,p_split:S.splitMode});
  if(method==='counter' && breakdown){
    // attach the split so the cashier knows exactly what to collect from whom
    await sb.from('requests')
      .update({ detail:'Split: '+breakdown })
      .eq('session_id',S.sessionId).eq('type','payment').eq('status','open');
  }
  S.busy=false;
  await loadSession(); render();
  toast(method==='upi'?'Payment received':'Counter notified');
}
async function confirmCash(sessionId){
  await sb.rpc('confirm_counter_payment',{p_session_id:sessionId});
  await loadStaffData(); render(); toast('Payment confirmed');
}
async function toggleAvail(id,cur){
  await sb.from('menu_items').update({is_available:!cur}).eq('id',id);
  await loadMenu(); render();
}
async function staffLogin(){
  const { data } = await sb.rpc('staff_login',{p_code:S.code.trim()});
  const m = Array.isArray(data)?data[0]:data;
  if(!m){ S.codeErr='That code isn\'t recognised.'; render(); return; }
  S.staff=m; S.role=m.role; localStorage.setItem('qrios_staff',JSON.stringify(m));
  S.view='staff';
  await loadStaffData(); await subscribe(); render();
  toast('Welcome, '+m.name.split(' ')[0]);
}
function staffOut(){ localStorage.removeItem('qrios_staff'); S.staff=null; S.role=null; S.view='landing'; render(); }
function leaveTable(){ clearSession(); S.view='landing'; render(); }

/* ───────── bill maths ───────── */
function bill(){
  const live = S.orders.filter(o=>o.status!=='rejected').map(o=>o.id);
  const sub = S.items.filter(i=>live.includes(i.order_id)).reduce((s,i)=>s+i.price_snapshot*i.qty,0);
  const gst = Math.round(sub*(S.rest?.gst_percent||5)/100);
  return {sub,gst,total:sub+gst};
}

function splitByItem(){
  const live = S.orders.filter(o=>o.status!=='rejected').map(o=>o.id);
  const rows = S.items.filter(i=>live.includes(i.order_id));
  const {sub,total} = bill();
  const map = {};
  S.members.forEach(m=>map[m.name]=0);
  rows.forEach(i=>{ map[i.added_by] = (map[i.added_by]||0) + i.price_snapshot*i.qty; });
  return Object.entries(map).map(([name,amt])=>({
    name,
    color:(S.members.find(m=>m.name===name)||{}).color||'#C9A550',
    items: rows.filter(i=>i.added_by===name).reduce((n,i)=>n+i.qty,0),
    amt: sub ? Math.round(amt/sub*total) : 0
  })).filter(p=>p.items>0 || S.members.some(m=>m.name===p.name));
}
function splitSummary(){
  if(S.splitMode==='equally'){
    const {total}=bill(); const per=Math.ceil(total/Math.max(1,S.members.length));
    return S.members.map(m=>m.name+' ₹'+per).join(' · ');
  }
  if(S.splitMode==='byitem') return splitByItem().map(p=>p.name+' ₹'+p.amt).join(' · ');
  return '';
}

              :o.status==='preparing'?`<button class="tbtn t-nx" onclick="QR.adv(${o.id},'ready')">Mark ready</button>`
              :`<button class="tbtn t-ok" onclick="QR.adv(${o.id},'served')">Mark served</button>`}</div>
          </div>`}).join('') : `<div class="empty">Nothing here</div>`}`;
    }).join('');
    if(!S.tickets.length) body = `<div class="empty"><b>No open tickets</b>New orders appear here the moment a guest sends them — no refresh needed.</div>`;
  }
  if(S.tab==='req'){
    body = S.allReq.length? S.allReq.map(r=>`<div class="card row">
        <div style="flex:1"><b style="font-size:13px">${esc(r.label)}</b><div class="mut mono">${esc(r.sessions?.tables?.label||r.table_label||'')} · ${ago(r.created_at)}</div>${r.detail?`<div class="mut">${esc(r.detail)}</div>`:''}</div>
        ${r.type==='payment'?`<button class="add" onclick="QR.cash('${r.session_id}')">Confirm payment</button>`:`<button class="add" onclick="QR.done('${r.id}')">Done</button>`}
      </div>`).join('') : `<div class="empty"><b>All caught up</b>Guest requests appear here instantly.</div>`;
  }
  if(S.tab==='floor'){
    body = S.sessions.length? S.sessions.map(s=>{
      const host=(s.session_members||[]).find(m=>m.is_host);
      return `<div class="card"><div class="row" style="justify-content:space-between">
        <b class="mono" style="font-size:15px">${esc(s.tables?.label||'')}</b>
        <span class="st ${s.status==='billing'?'s-rejected':'s-ready'}">${s.status==='billing'?'Billing':'Occupied'}</span></div>
        <div class="mut" style="margin-top:5px">${esc(host?.name||'')} ♔ + ${(s.session_members||[]).length-1} · PIN ${esc(s.pin)}</div></div>`}).join('')
      : `<div class="empty"><b>All tables free</b>Sessions appear here when guests scan.</div>`;
  }
  if(S.tab==='dash'){
    const d=STATS;
    if(!d) body = `<div class="empty"><b>Loading numbers…</b>Pulling today's figures.</div>`;
    else{
      const t=d.today||{}, k=d.kitchen||{}, sv=d.service||{}, lv=d.live||{};
      const top=d.top_items||[], cat=d.by_category||[], hrs=d.by_hour||[], tr=d.trend||[], slow=d.slow_items||[];
      const pm=d.pay_mix||{}, rt=d.req_types||{};
      const maxQ=Math.max(1,...top.map(x=>x.qty));
      const maxC=Math.max(1,...cat.map(x=>x.revenue));
      const maxH=Math.max(1,...hrs.map(x=>x.revenue));
      const maxT=Math.max(1,...tr.map(x=>x.revenue));
      const payTot=Math.max(1,(pm.counter||0)+(pm.upi||0));
      const rq=[['water','Water'],['cutlery','Cutlery'],['cleaning','Cleaning'],['other','Captain']];
      const rqTot=Math.max(1,rq.reduce((a,[x])=>a+(rt[x]||0),0));
      body = `
      <div class="kpis">
        <div class="kpi"><div class="v">₹${(t.revenue||0).toLocaleString('en-IN')}</div><div class="l">Revenue today</div></div>
        <div class="kpi"><div class="v">${t.bills||0}</div><div class="l">Bills settled</div></div>
        <div class="kpi"><div class="v">₹${t.avg||0}</div><div class="l">Average bill</div></div>
        <div class="kpi"><div class="v">${d.covers||0}</div><div class="l">Covers seated</div></div>
        <div class="kpi"><div class="v">₹${(t.gst||0).toLocaleString('en-IN')}</div><div class="l">GST collected</div></div>
        <div class="kpi"><div class="v">${k.prep_min||0}m</div><div class="l">Avg prep time</div></div>
      </div>

      <div class="card"><div class="h4">Live right now</div>
        <div class="pill2"><span>Open tickets</span><b class="mono">${lv.open_tickets||0}</b></div>
        <div class="pill2"><span>Open guest requests</span><b class="mono">${lv.open_requests||0}</b></div>
        <div class="pill2"><span>Tables occupied</span><b class="mono">${lv.open_tables||0}</b></div>
        <div class="pill2"><span>Guests seated</span><b class="mono">${lv.seated||0}</b></div>
      </div>

      ${hrs.length?`<div class="card"><div class="h4">Revenue by hour</div>
        <div class="vbars">${hrs.map(h=>`<div class="vb">
          <div class="bar2 ${h.revenue===maxH?'now':''}" style="height:${Math.round(h.revenue/maxH*100)}%"></div>
          <div class="lbl">${h.hour}h</div></div>`).join('')}</div></div>`:''}

      ${top.length?`<div class="card"><div class="h4">Best sellers today</div>
        ${top.map(x=>`<div class="brow"><div class="t"><span>${esc(x.name)}</span><span class="mono mut">${x.qty} · ₹${x.revenue}</span></div>
          <div class="btrack"><div class="bfill" style="width:${Math.round(x.qty/maxQ*100)}%"></div></div></div>`).join('')}</div>`
       :`<div class="card"><div class="h4">Best sellers today</div><div class="mut">No orders yet today.</div></div>`}

      ${cat.length?`<div class="card"><div class="h4">Revenue by category</div>
        ${cat.map(x=>`<div class="brow"><div class="t"><span>${esc(x.category)}</span><span class="mono mut">₹${x.revenue}</span></div>
          <div class="btrack"><div class="bfill g" style="width:${Math.round(x.revenue/maxC*100)}%"></div></div></div>`).join('')}</div>`:''}

      <div class="card"><div class="h4">Kitchen health</div>
        <div class="pill2"><span>Avg time to accept</span><b class="mono">${k.accept_min||0} min</b></div>
        <div class="pill2"><span>Avg prep (accept → ready)</span><b class="mono">${k.prep_min||0} min</b></div>
        <div class="pill2"><span>Served late (over 12 min)</span><b class="mono" style="color:${k.late?'var(--red)':'var(--emerald)'}">${k.late||0}</b></div>
        <div class="pill2"><span>Orders declined</span><b class="mono" style="color:${k.declined?'var(--red)':'var(--emerald)'}">${k.declined||0}</b></div>
      </div>

      <div class="card"><div class="h4">Service pulse</div>
        ${rq.map(([key,label])=>`<div class="brow"><div class="t"><span>${label}</span><span class="mono mut">${rt[key]||0}</span></div>
          <div class="btrack"><div class="bfill" style="width:${Math.round((rt[key]||0)/rqTot*100)}%"></div></div></div>`).join('')}
        <div class="pill2" style="margin-top:9px"><span>Avg response time</span><b class="mono">${sv.avg_min||0} min</b></div>
      </div>

      <div class="card"><div class="h4">Payment mix</div>
        <div class="brow"><div class="t"><span>Counter (cash/card)</span><span class="mono mut">${pm.counter||0} bills</span></div>
          <div class="btrack"><div class="bfill" style="width:${Math.round((pm.counter||0)/payTot*100)}%"></div></div></div>
        <div class="brow"><div class="t"><span>UPI</span><span class="mono mut">${pm.upi||0} bills</span></div>
          <div class="btrack"><div class="bfill g" style="width:${Math.round((pm.upi||0)/payTot*100)}%"></div></div></div>
      </div>

      ${tr.length?`<div class="card"><div class="h4">Last 7 days</div>
        <div class="vbars">${tr.map((x,i)=>`<div class="vb">
          <div class="bar2 ${i===tr.length-1?'now':''}" style="height:${Math.round(x.revenue/maxT*100)}%"></div>
          <div class="lbl">${x.day.split(' ')[0]}</div></div>`).join('')}</div>
        <div class="mut" style="margin-top:6px;font-size:11px">Today highlighted</div></div>`:''}

      ${slow.length?`<div class="card"><div class="h4">No sales today</div>
        ${slow.map(x=>`<div class="pill2"><span>${esc(x.name)}</span><b class="mono mut">₹${x.price}</b></div>`).join('')}
        <div class="mut" style="font-size:11px">Push these, or take them off the menu.</div></div>`:''}
      `;
    }
  }
  if(S.tab==='menu'){
    body = S.menu.map(m=>`<div class="card row">
      <div class="veg"></div><div style="flex:1"><b style="font-size:13px">${esc(m.name)}</b><div class="mut mono">₹${m.price}</div></div>
      <div class="sw ${m.is_available?'on':''}" onclick="QR.avail('${m.id}',${m.is_available})"></div></div>`).join('');
  }

  return `<div class="wrap"><div class="hd">
      <div class="hd-row"><div><h1>${isK?'Kitchen':'Floor'}</h1><div class="sub">${esc(S.staff?.name||'')} · ${esc(S.role||'')}</div></div>
      <div style="display:flex;gap:8px">
        <button class="chip" onclick="QR.reload()"><b>↻</b><span>Refresh</span></button>
        <button class="chip" onclick="QR.out()"><b>⎋</b><span>Sign out</span></button>
      </div></div>
      <div class="tabs">${tabs.map(([k,l])=>`<button class="tab ${S.tab===k?'on':''}" onclick="QR.f('tab','${k}')">${l}${k==='req'&&S.allReq.length?`<span class="b">${S.allReq.length}</span>`:''}${k==='tickets'&&S.tickets.filter(o=>o.status==='placed').length?`<span class="b">${S.tickets.filter(o=>o.status==='placed').length}</span>`:''}</button>`).join('')}</div>
    </div><div class="body sn">${body}</div></div>`;
}

function render(){
  const a=$('app');
  const foc=document.activeElement?.id, ss=document.activeElement?.selectionStart;
  a.innerHTML =
    S.view==='setup'? vSetup() :
    S.view==='landing'? vLanding() :
    S.view==='register'? vRegister() :
    S.view==='join'? vJoin() :
    S.view==='guest'? vGuest() :
    S.view==='closed'? vClosed() :
    S.view==='code'? vCode() :
    S.view==='staff'? vStaff() :
    `<div class="wrap dark"><div class="hero"><div class="mk">${LOGO(42,'#C9A550')}</div><p>Loading…</p></div></div>`;
  if(foc){ const e=$(foc); if(e){ e.focus(); try{ e.setSelectionRange(ss,ss); }catch{} } }
}

/* keeps the primary button in step with what's typed, WITHOUT re-rendering
   (a re-render would destroy the field you're typing in) */
function syncCta(){
  const b=document.querySelector('.cta'); if(!b) return;
  let ok=false, label=null;
  if(S.view==='code'){
    ok = S.code.trim().length===6;
    label = ok?'Sign in':'Enter all 6 characters';
  } else if(S.view==='register'){
    ok = !!S.regName.trim() && S.regPhone.length===10 && S.agree;
    label = S.busy?'Starting…':(ok?'Start table':'Fill everything above');
  } else if(S.view==='join'){
    const filled = S.pinIn.join('').length===4;
    ok = filled && !!S.joinName.trim();
    label = S.busy?'Joining…':(ok?'Join table':(filled?'Add your name':'Enter the PIN'));
  } else return;
  b.disabled = !ok || S.busy;
  b.classList.toggle('brass', !!ok);
  if(label) b.textContent = label;
}

/* ───────── public handlers ───────── */
window.QR = {
  f(k,v){
    S[k]=v;
    if(k==='tab'){ render(); refreshNow(); }
    else if(k==='splitMode'){ render(); }
    else syncCta();
  },
  tog(k){ S[k]=!S[k]; render(); syncCta(); },
  phone(el){ el.value=el.value.replace(/\D/g,'').slice(0,10); S.regPhone=el.value; syncCta(); },
  go(v){ S.view=v; S.err=''; S.codeErr=''; render(); },
  pin(i,el){
    const v=el.value.replace(/\D/g,'').slice(-1); el.value=v; S.pinIn[i]=v;
    if(S.pinErr){ S.pinErr=false; document.querySelectorAll('.pins input').forEach(x=>x.style.borderColor='var(--line)'); }
    el.style.borderColor = v?'var(--brass)':'var(--line)';
    if(v&&i<3) $('p'+(i+1))?.focus();
    syncCta();
  },
  start(){ startOrJoin(null); },
  join(){ startOrJoin(S.pinIn.join('')); },
  async helpReq(){
    await sb.from('requests').insert({restaurant_id:S.rest.id,table_label:S.tableLabel,type:'joinhelp',
      label:'Guest can\'t join — needs the table PIN', detail:'Table '+S.tableLabel});
    toast('Staff are on the way'); },
  cart(id,d){ const q=(S.cart[id]||0)+d; if(q<=0) delete S.cart[id]; else S.cart[id]=q; render(); },
  place(){ placeOrder(); },
  req(t,l){ sendReq(t,l); },
  adv(id,to){ advance(id,to); },
  rej(id){ const r=prompt('Why? (the guest will see this)','Item just sold out'); if(r) advance(id,'rejected',r); },
  done(id){ resolveReq(id); },
  cash(sid){ confirmCash(sid); },
  avail(id,cur){ toggleAvail(id,cur); },
  settle(m){ settle(m); },
  login(){ staffLogin(); },
  out(){ staffOut(); },
  async reload(){ if(S.role){ await loadStaffData(); } else { await loadSession(); } await loadMenu(); render(); toast('Refreshed'); },
  leave(){ leaveTable(); },
  saveCfg(){
    const u=$('cfgU').value.trim(), k=$('cfgK').value.trim();
    if(!u||!k){ toast('Both fields are required'); return; }
    localStorage.setItem('qrios_url',u); localStorage.setItem('qrios_key',k);
    location.reload();
  }
};

/* ───────── boot ───────── */
(async function boot(){
  if(!sb){ S.view='setup'; render(); return; }
  try{
    await loadRestaurant();
    if(!S.rest){ S.view='setup'; render(); toast('Connected, but no restaurant found — run the seed SQL'); return; }
    await loadMenu();

    const saved = localStorage.getItem('qrios_staff');
    if(saved && !S.qrToken){ S.staff=JSON.parse(saved); S.role=S.staff.role; S.view='staff'; await loadStaffData(); await subscribe(); render(); return; }

    if(S.qrToken){
      if(S.sessionId){
        await loadSession();
        if(S.sessionId){ S.view='guest'; await subscribe(); render(); return; }
      }
      // is there an open session at this table already?
      const { data: t } = await sb.from('tables').select('id,label').eq('qr_token',S.qrToken).maybeSingle();
      if(!t){ S.view='landing'; S.err='Table not recognised'; render(); return; }
      S.tableLabel=t.label;
      const { data: open } = await sb.from('sessions').select('id, session_members(name,is_host)')
        .eq('table_id',t.id).neq('status','closed').maybeSingle();
      if(open){ S.hostName=(open.session_members||[]).find(m=>m.is_host)?.name||''; S.view='join'; }
      else S.view='register';
      render(); await subscribe(); return;
    }
    S.view='landing'; render();
  }catch(e){
    console.error(e); S.view='setup'; render(); toast('Could not connect — check your keys');
  }
})();
/* ── keeping screens fresh ──
   Realtime is the primary path. These are safety nets for restaurant wifi:
   a light poll while the screen is visible, and an immediate refresh when
   someone returns to the tab (very common on a guest's phone).            */
let polling=false;
async function refreshNow(){
  if(polling) return; polling=true;
  try{
    if(S.role) await loadStaffData(); else if(S.sessionId) await loadSession();
    await loadMenu();
    lastSync = Date.now();
    if(S.view==='guest'||S.view==='staff') render();
  }catch(e){ /* offline — try again next tick */ }
  finally{ polling=false; }
}
function typing(){
  const a=document.activeElement;
  return !!(a && ['INPUT','TEXTAREA'].includes(a.tagName));
}
setInterval(()=>{
  if(document.hidden || typing()) return;
  if(S.view==='guest' || S.view==='staff') refreshNow();
}, 4000);

document.addEventListener('visibilitychange', ()=>{
  if(!document.hidden && (S.view==='guest'||S.view==='staff')){ refreshNow(); subscribe(); }
});
window.addEventListener('online', ()=>{ setConn(false); refreshNow(); subscribe(); });
window.addEventListener('offline', ()=> setConn(false));
</script>
